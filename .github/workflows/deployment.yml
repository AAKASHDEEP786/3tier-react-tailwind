name: Build and Deploy

on:
  push:
    branches:
      - react-tailwind-website

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: docker build -t aakashdevops/tailwind-frontend:latest ./frontend

      - name: Build Backend Image
        run: docker build -t aakashdevops/tailwind-backend:latest ./backend

      - name: Push Frontend Image
        run: docker push aakashdevops/tailwind-frontend:latest

      - name: Push Backend Image
        run: docker push aakashdevops/tailwind-backend:latest

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app || mkdir ~/app && cd ~/app
            docker pull aakashdevops/tailwind-frontend:latest
            docker pull aakashdevops/tailwind-backend:latest
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --remove-orphans